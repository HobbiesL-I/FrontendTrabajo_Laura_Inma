<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single+Ink:wght@100..900&family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Momo+Trust+Display&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Paytone+One&family=Playwrite+DE+SAS:wght@100..400&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rozha+One&family=Rye&family=Satisfy&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">
    <script src="./js/script-dom-boardgamesListPage.js"></script>
    <link rel="stylesheet" href="css/styleCommonElements.css">
    <link rel="stylesheet" href="css/styleFonts.css">
    <link rel="stylesheet" href="css/styleBoardgameList.css">
    <title>Juegos de Mesa Lista</title>
</head>

<body>
    <header class="header-area">

        <div class="header-image">
            <img src="https://placehold.co/100" alto="Logo Página Web">
        </div>

        <ul class="headerMenu-left font-title">
            <li onclick="window.location.href='boardgameListPage.html'" class="header-options">Juegos de Mesa</li>
            <li onclick="window.location.href=''" class="header-options">Películas</li>
            <li onclick="window.location.href=''" class="header-options">Mis Reseñas</li>
        </ul>

        <div class="headerMenu-right font-title">
            <form method="get" id="search-hobbie">
                <input type="search" id="s" class="search-hobbie" value=""
                    placeholder="¡Búscalo directamente y no te pierdas nada!" />
            </form>
        </div>
    </header>

    <div class="container-area" id="option">

        <section class="container-filterMenu">
            <!--Menu filtrar-->
            <ul class="filterMenu">
                <p>Opciones y filtros</p>

                <li id="age">Edad
                    <!--SubMenu Edad de juegos || Función createOptions en js-->
                </li>

                <li id="numberPlayers">Num. Jugadores
                    <!--SubMenu Numero de Jugadores || Función createOptions en js-->
                </li>
                <li id="mecanic">Mecanica
                    <!--SubMenu Mecanicas || Función createOptions en js-->
                </li>
                <li id="price">Precio
                    <!--SubMenu Precio || Función createOptions en js-->
                </li>
            </ul>
        </section>

        <section class="container-boardgameList" id="content">
            <!--listado juegos de mesa || Función createBoardgames en js-->
        </section>


    </div>

    <footer class="footer-area">
        <h1>Subscribete a nuestro boletin para mantenerte informad@ de las últimas tendencias</h1>
        <form>
            <input class="field" placeholder="Correo electrónico" type="text" required>
            <button onclick="window.location.href=''" class="btn-submit">Subscribirse</button>
        </form>
        <div class="footer-images">
            <a href="" class="socialMedia-btn">
                <img class="image-socialMedia" src="./images/icon_insta.png" alto="Logo Página Web">
            </a>

            <a href="">
                <img class="image-socialMedia" src="./images/icon_tiktok.png" alto="Logo Página Web">
            </a>

            <a href="">
                <img class="image-socialMedia" src="./images/icon_linkedin.png" alto="Logo Página Web">
            </a>
        </div>
        <p>© 2026 Copyright San Valero.com Todos los derechos reservados</p>
    </footer>

</body>

</html>
